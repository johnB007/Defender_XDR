<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560" role="img" aria-labelledby="title desc">
  <title id="title">Monthly Suspicious Email Report architecture</title>
  <desc id="desc">A monthly recurrence builds a Defender XDR hunting query, runs it through Microsoft Graph using managed identity, formats the results as HTML, and emails the report through Office 365.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#17365d"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#50e6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .title { font: 700 34px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .subtitle { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #b9d7ea; }
      .box-title { font: 700 18px "Segoe UI", Arial, sans-serif; fill: #fff; }
      .box-text { font: 400 14px "Segoe UI", Arial, sans-serif; fill: #d7e9f5; }
      .small { font: 600 12px "Segoe UI", Arial, sans-serif; fill: #9fc5dc; }
      .flow { stroke: #67e8f9; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .card { fill: #15324a; stroke: #2d6a8d; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .service { fill: #0c4a6e; stroke: #38bdf8; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .output { fill: #17433b; stroke: #34d399; stroke-width: 2; rx: 16; filter: url(#shadow); }
    </style>
  </defs>

  <rect width="1300" height="560" fill="url(#background)"/>
  <rect x="0" y="0" width="1300" height="8" fill="url(#header)"/>
  <text x="65" y="70" class="title">Monthly Suspicious Email Report</text>
  <text x="65" y="102" class="subtitle">Scheduled Defender XDR hunting, report formatting, and email delivery</text>

  <rect x="65" y="190" width="190" height="130" class="service"/>
  <circle cx="105" cy="230" r="20" fill="#38bdf8"/>
  <path d="M105 218v13l9 6" stroke="#07243a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="135" y="230" class="box-title">Recurrence</text>
  <text x="90" y="273" class="box-text">Monthly schedule</text>
  <text x="90" y="296" class="small">Built-in Logic Apps trigger</text>

  <rect x="310" y="190" width="200" height="130" class="card"/>
  <text x="335" y="230" class="box-title">Build query</text>
  <text x="335" y="273" class="box-text">Prepare hunting request</text>
  <text x="335" y="296" class="small">Parameterized recipients</text>

  <rect x="565" y="190" width="220" height="130" class="service"/>
  <text x="590" y="230" class="box-title">Advanced Hunting</text>
  <text x="590" y="273" class="box-text">Microsoft Graph API</text>
  <text x="590" y="296" class="small">Managed identity authentication</text>

  <rect x="840" y="190" width="180" height="130" class="card"/>
  <text x="865" y="230" class="box-title">Format report</text>
  <text x="865" y="273" class="box-text">Create HTML table</text>
  <text x="865" y="296" class="small">Hunting result rows</text>

  <rect x="1075" y="190" width="170" height="130" class="output"/>
  <text x="1100" y="230" class="box-title">Send email</text>
  <text x="1100" y="273" class="box-text">Office 365</text>
  <text x="1100" y="296" class="small">Approved recipient</text>

  <path d="M255 255 H300" class="flow"/>
  <path d="M510 255 H555" class="flow"/>
  <path d="M785 255 H830" class="flow"/>
  <path d="M1020 255 H1065" class="flow"/>

  <rect x="230" y="395" width="840" height="76" rx="14" fill="#0b2034" stroke="#244a64"/>
  <text x="260" y="425" class="box-text">Security boundary</text>
  <text x="260" y="450" class="small">System-assigned managed identity | ThreatHunting.Read.All | authorized Office 365 connection | no embedded credentials</text>
</svg>
